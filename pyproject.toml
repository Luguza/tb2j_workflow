[project]
name = "tb2j_workflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mp-api>=0.46.4",
    "pymatgen>=2026.5.4",
    "tb2j>=0.9.20",
]

[project.scripts]
gen-scf = "tb2j_workflow.scf.generate_scf_input:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb2j_workflow"]
